    <title>Elite Sports | Nexus Infrastructure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

      window.process = { env: { API_KEY: "" } };

    <style>
      :root {
        --bg-deep: #020617;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-deep);
        color: #f8fafc;
        margin: 0;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root:empty::before {
        content: 'INICIANDO PROTOCOLO NEXUS...';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Outfit', sans-serif;
        font-weight: 900;
        color: #fbbf24;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        font-size: 10px;
        opacity: 0.4;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(0.95); }
        50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      }
      .glass {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.03);
      }
      .gradient-gold {
        background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      }
    </style>
